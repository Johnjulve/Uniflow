# ==============================================================================
# Uniflow IMS - Production Nginx Reverse Proxy Configuration
# ==============================================================================
# Serves the compiled React 19 SPA frontend, proxies /api/v1/ and /admin/
# to the Django backend application server, and serves static assets.
# ==============================================================================

upstream uniflow_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name uniflow.local localhost;

    # Replace with the absolute path to your uniflow repository
    # e.g. /var/www/uniflow or D:/System Projects/Uniflow
    set $uniflow_root /var/www/uniflow;

    # Frontend SPA build directory
    root $uniflow_root/frontend/dist;
    index index.html;

    # Maximum request body size (for document attachments / CSV imports)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Cache (Vite hashed bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Django Admin Static Files (collected via collectstatic)
    location /static/ {
        alias $uniflow_root/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Django REST API Endpoints
    location /api/ {
        proxy_pass http://uniflow_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # Django Admin Portal
    location /admin/ {
        proxy_pass http://uniflow_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Frontend Single-Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden / dot files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
